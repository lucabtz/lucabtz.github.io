<!DOCTYPE html>
<html lang="en">

<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />

    <meta property="og:title" content="{{ page.title | escape }}" />
    {% if page.is_post %}
    <meta property="og:type" content="article" />
    {% else %}
    <meta property="og:type" content="website" />
    {% endif %}
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:image" content="{{ site.url }}/images/pic.jpg">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="{{ site.twitter_username }}">
    <meta name="twitter:title" content="{{ page.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">

    <title>{{ page.title | escape }} - {{ site.title | escape }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link id="theme" rel="stylesheet" type="text/css" href="/assets/styles/main.css">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css">

    {% feed_meta %}

    <script src="/assets/js/theme.js"></script>
</head>

<body>
    <div class="container">
        <div class="headbar">
            <div class="sitename">
                {{ site.title | escape }}
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/blog">Blog</a></li>
                    <li><a href="/resume">Resume</a></li>
                    <li>
                        <div class="feed-button">
                            <img class="rss-icon" src="/assets/images/rss.png" alt="RSS feed">
                            <a href="/feed.xml">Feed</a>
                        </div>
                    </li>
                    <li>
                        <input type="checkbox" id="switcher">
                        <label for="switcher"></label>
                    </li>
                </ul>
            </nav>
        </div>

        <main>
            {{ content }}
        </main>

        <footer>
            Copyright - Luca Bertozzi - Made with Jekyll
        </footer>
    </div>
</body>

</html>
